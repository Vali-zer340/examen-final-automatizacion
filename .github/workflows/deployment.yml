name: Deployment Pipeline

on:
  push:
    branches:
      - feature/deployment-pipeline
      - develop

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y empaquetar
        run: mvn clean package -DskipTests

      - name: Guardar artefacto de aplicacion
        uses: actions/upload-artifact@v6
        with:
          name: aplicacion-jar
          path: target/*.jar

  tests:
    name: Pruebas unitarias e integracion
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn verify

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar Acceptance Tests
        run: mvn test -Pacceptance

  deploy:
    name: Deploy a ambiente de prueba
    runs-on: ubuntu-latest
    needs: acceptance

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v8
        with:
          name: aplicacion-jar
          path: deploy/nueva-version

      - name: Crear ambiente de prueba
        run: |
          mkdir -p deploy/current
          mkdir -p deploy/backup
          echo "version-anterior" > deploy/current/version.txt

      - name: Crear respaldo antes del despliegue
        run: |
          cp -r deploy/current/. deploy/backup/

      - name: Desplegar nueva version
        run: |
          cp -r deploy/nueva-version/. deploy/current/
          echo "version-nueva" > deploy/current/version.txt

      - name: Validar despliegue
        run: |
          test -f deploy/current/version.txt
          grep "version-nueva" deploy/current/version.txt
          echo "Despliegue exitoso en ambiente de prueba"

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Simular estado desplegado
        run: |
          mkdir -p deploy/current
          mkdir -p deploy/backup
          echo "version-nueva" > deploy/current/version.txt
          echo "version-anterior" > deploy/backup/version.txt

      - name: Ejecutar rollback
        run: |
          rm -rf deploy/current/*
          cp -r deploy/backup/. deploy/current/

      - name: Validar rollback
        run: |
          grep "version-anterior" deploy/current/version.txt
          echo "Rollback ejecutado correctamente"